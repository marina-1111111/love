<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>💌 Love Cinematic App</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

<!-- 🎥 FX CANVAS -->
<canvas id="fxCanvas"></canvas>

<!-- AUDIO -->
<audio id="openSound" src="open.mp3"></audio>
<audio id="correctSound" src="correct.mp3"></audio>
<audio id="finalSound" src="final.mp3"></audio>

<div id="app">

<!-- 💌 ENVELOPE -->
<section class="screen active" id="screen1">

<div id="envelope" class="envelope">
<div class="seal">💌</div>
<div class="shine"></div>
</div>

<h1>رسالة سرّية</h1>
<p>اضغط لفتح الظرف</p>

</section>

<!-- 📜 INTRO -->
<section class="screen" id="screen2">

<div class="card">
<h1>تعرفيني قد اي</h1>
<p>ابدأ الرحلة</p>
<button onclick="startQuiz()">ابدأ</button>
</div>

</section>

<!-- 🎮 QUIZ -->
<section class="screen" id="screen3">

<div class="card">

<div class="bar"><div id="fill"></div></div>

<h3 id="counter"></h3>
<h1 id="question"></h1>

<input id="answer" placeholder="اكتب الإجابة">

<button onclick="checkAnswer()">إرسال</button>

<p id="message"></p>

</div>

</section>

<!-- ❤️ FINAL -->
<section class="screen" id="screen4">

<div class="card">

<div id="typewriter"></div>

<h1 class="love">أنا بحبك ❤️</h1>

</div>

</section>

</div>

<script src="script.js"></script>
</body>
</html>
